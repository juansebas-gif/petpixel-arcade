<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <!-- Filtros de Glow Neón -->
    <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-orange" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-gold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradientes de Césped y Fondo -->
    <linearGradient id="grass-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d3b1b" />
      <stop offset="100%" stop-color="#072210" />
    </linearGradient>
    <linearGradient id="header-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    
    <!-- Patrón de Franjas de Cancha -->
    <pattern id="field-stripes" width="80" height="480" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="40" height="480" fill="#135226" opacity="0.9" />
      <rect x="40" y="0" width="40" height="480" fill="#18632f" opacity="0.9" />
    </pattern>

    <!-- Patrón de Líneas CRT -->
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1.2" opacity="0.35" />
    </pattern>
  </defs>

  <!-- Fondo General de la Cancha -->
  <rect x="0" y="0" width="800" height="480" fill="url(#grass-dark)" />
  <rect x="25" y="45" width="750" height="390" fill="url(#field-stripes)" />

  <!-- Líneas Reglamentarias de Fútbol Atari -->
  <g stroke="#e2f7e8" stroke-width="3" opacity="0.85" fill="none">
    <!-- Perímetro del campo -->
    <rect x="35" y="55" width="730" height="370" rx="4" />
    <!-- Línea de medio campo -->
    <line x1="400" y1="55" x2="400" y2="425" />
    <!-- Círculo central y punto -->
    <circle cx="400" cy="240" r="60" />
    <circle cx="400" cy="240" r="4" fill="#e2f7e8" />
    
    <!-- Áreas y Portería Izquierda (Azul) -->
    <rect x="35" y="145" width="100" height="190" />
    <rect x="35" y="185" width="45" height="110" />
    <path d="M 135 200 A 45 45 0 0 1 135 280" />
    <rect x="12" y="180" width="23" height="120" stroke="#38bdf8" stroke-width="2.5" fill="#0369a1" fill-opacity="0.25" />

    <!-- Áreas y Portería Derecha (Naranja) -->
    <rect x="665" y="145" width="100" height="190" />
    <rect x="720" y="185" width="45" height="110" />
    <path d="M 665 200 A 45 45 0 0 0 665 280" />
    <rect x="765" y="180" width="23" height="120" stroke="#fb7185" stroke-width="2.5" fill="#be123c" fill-opacity="0.25" />
  </g>

  <!-- Efecto de Sandevistan / Estelas del Velocista -->
  <g opacity="0.4">
    <circle cx="210" cy="240" r="22" fill="#00f0ff" />
    <circle cx="240" cy="240" r="23" fill="#38bdf8" />
    <circle cx="270" cy="240" r="24" fill="#60a5fa" />
  </g>

  <!-- Jugador 1 (Azul / Neón) -->
  <g filter="url(#glow-blue)">
    <circle cx="300" cy="240" r="26" fill="#0284c7" stroke="#38bdf8" stroke-width="3.5" />
    <!-- Símbolo Habilidad Rayo -->
    <path d="M 300 223 L 291 240 L 301 240 L 297 257 L 311 238 L 301 238 Z" fill="#ffffff" />
  </g>

  <!-- Barrera Habilidad Constructor -->
  <rect x="530" y="195" width="14" height="90" rx="3" fill="#eab308" stroke="#fef08a" stroke-width="2" filter="url(#glow-gold)" opacity="0.9" />

  <!-- Jugador 2 (Naranja / IA) -->
  <g filter="url(#glow-orange)">
    <circle cx="585" cy="240" r="26" fill="#ea580c" stroke="#fb923c" stroke-width="3.5" />
    <!-- Ícono Constructor Ladrillos -->
    <rect x="576" y="233" width="8" height="5" fill="#ffffff" />
    <rect x="586" y="233" width="8" height="5" fill="#ffffff" />
    <rect x="572" y="240" width="8" height="5" fill="#ffffff" />
    <rect x="582" y="240" width="8" height="5" fill="#ffffff" />
    <rect x="592" y="240" width="8" height="5" fill="#ffffff" />
  </g>

  <!-- Balón en Movimiento -->
  <g transform="translate(425, 232)">
    <circle cx="10" cy="10" r="14" fill="#ffffff" stroke="#0f172a" stroke-width="2" />
    <!-- Pentágonos de balón -->
    <polygon points="10,4 15,8 13,14 7,14 5,8" fill="#0f172a" />
    <line x1="10" y1="4" x2="10" y2="0" stroke="#0f172a" stroke-width="1.5" />
    <line x1="15" y1="8" x2="19" y2="6" stroke="#0f172a" stroke-width="1.5" />
    <line x1="13" y1="14" x2="16" y2="18" stroke="#0f172a" stroke-width="1.5" />
    <line x1="7" y1="14" x2="4" y2="18" stroke="#0f172a" stroke-width="1.5" />
    <line x1="5" y1="8" x2="1" y2="6" stroke="#0f172a" stroke-width="1.5" />
    <!-- Estela de velocidad -->
    <line x1="-8" y1="5" x2="-22" y2="5" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.7" />
    <line x1="-5" y1="10" x2="-28" y2="10" stroke="#fef08a" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
    <line x1="-8" y1="15" x2="-20" y2="15" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.7" />
  </g>

  <!-- Marcador HUD Superior Retro -->
  <g transform="translate(230, 10)">
    <rect x="0" y="0" width="340" height="42" rx="8" fill="#090d16" stroke="#334155" stroke-width="2" />
    
    <!-- Puntuación J1 Azul -->
    <rect x="8" y="6" width="32" height="30" rx="4" fill="#0284c7" />
    <text x="24" y="27" font-family="'Courier New', monospace" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">2</text>
    
    <!-- Centro VS -->
    <text x="170" y="20" font-family="'Press Start 2P', monospace, sans-serif" font-size="10" fill="#38bdf8" text-anchor="middle">1P VS IA</text>
    <text x="170" y="34" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#94a3b8" text-anchor="middle">FÚTBOL 2D</text>

    <!-- Puntuación Rival Naranja -->
    <rect x="300" y="6" width="32" height="30" rx="4" fill="#ea580c" />
    <text x="316" y="27" font-family="'Courier New', monospace" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">1</text>
  </g>

  <!-- Banner Inferior de Información y Habilidades -->
  <g transform="translate(60, 405)">
    <rect x="0" y="0" width="680" height="58" rx="8" fill="#090d16" stroke="#a78bfa" stroke-width="2" opacity="0.95" />
    <text x="340" y="24" font-family="'Press Start 2P', monospace, sans-serif" font-size="12" fill="#facc15" text-anchor="middle" filter="url(#glow-gold)">
      ★ FÚTBOL 2D ATARI ★
    </text>
    <text x="340" y="44" font-family="'Outfit', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#cbd5e1" text-anchor="middle">
      10 PERSONAJES CON HABILIDADES ÚNICAS &bull; TURBO &bull; FÍSICAS CONTINUAS &bull; 1P / 2P
    </text>
  </g>

  <!-- Superposición de Scanlines Retro CRT -->
  <rect x="0" y="0" width="800" height="480" fill="url(#scanlines)" pointer-events="none" />
</svg>


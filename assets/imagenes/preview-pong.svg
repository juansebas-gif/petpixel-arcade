<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <!-- Filtros Neón Cyberpunk -->
    <filter id="neon-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="neon-pink" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="neon-yellow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Fondo Cyberpunk -->
    <linearGradient id="cyber-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#080811" />
      <stop offset="50%" stop-color="#0e0f24" />
      <stop offset="100%" stop-color="#06060c" />
    </linearGradient>

    <!-- Scanlines -->
    <pattern id="pong-scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1.3" opacity="0.4" />
    </pattern>

    <!-- Cuadrícula de Fondo -->
    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 240, 255, 0.05)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Fondo Espacial Retro -->
  <rect x="0" y="0" width="800" height="480" fill="url(#cyber-bg)" />
  <rect x="0" y="0" width="800" height="480" fill="url(#cyber-grid)" />

  <!-- Borde Neón de la Mesa Pong -->
  <rect x="30" y="50" width="740" height="380" rx="8" fill="none" stroke="#252542" stroke-width="3" />
  <!-- Línea Central Discontinua -->
  <line x1="400" y1="50" x2="400" y2="430" stroke="rgba(255, 255, 255, 0.15)" stroke-width="4" stroke-dasharray="14 12" />

  <!-- Raqueta Jugador (Cian Neón - Izquierda) -->
  <g filter="url(#neon-cyan)">
    <rect x="65" y="180" width="16" height="100" rx="4" fill="#00f0ff" stroke="#e0ffff" stroke-width="2" />
  </g>

  <!-- Raqueta Bot Tramposo (Rosa Neón - Derecha) con Clones / Glitch -->
  <g opacity="0.3" filter="url(#neon-pink)">
    <rect x="715" y="110" width="16" height="60" rx="4" fill="#ff0055" />
    <rect x="715" y="310" width="16" height="60" rx="4" fill="#ff0055" />
  </g>
  <g filter="url(#neon-pink)">
    <rect x="719" y="195" width="16" height="120" rx="4" fill="#ff0055" stroke="#ffe0ec" stroke-width="2" />
  </g>

  <!-- Pelota Neón Amarilla con Distorsión Cuántica -->
  <!-- Estela de movimiento de pelota -->
  <line x1="480" y1="210" x2="520" y2="235" stroke="#ff0055" stroke-width="4" opacity="0.4" stroke-linecap="round" />
  <line x1="450" y1="220" x2="525" y2="238" stroke="#ffee00" stroke-width="6" opacity="0.7" stroke-linecap="round" />
  
  <g filter="url(#neon-yellow)">
    <rect x="525" y="232" width="18" height="18" fill="#ffee00" stroke="#ffffff" stroke-width="2" rx="2" />
  </g>

  <!-- Obstáculo / Trampa Teletransporte / Bomba del Bot -->
  <g transform="translate(360, 290)">
    <circle cx="20" cy="20" r="18" fill="#1b1026" stroke="#ff0055" stroke-width="2.5" />
    <text x="20" y="27" font-family="'Outfit', sans-serif" font-size="22" text-anchor="middle">💣</text>
  </g>

  <!-- HUD Superior Neón: Marcador -->
  <g transform="translate(240, 12)">
    <rect x="0" y="0" width="320" height="42" rx="6" fill="#0e0e1a" stroke="#373752" stroke-width="2" />
    <!-- Puntaje Jugador -->
    <text x="50" y="29" font-family="'Press Start 2P', monospace" font-size="20" fill="#00f0ff" text-anchor="middle" filter="url(#neon-cyan)">3</text>
    <!-- VS / Título -->
    <text x="160" y="26" font-family="'Press Start 2P', monospace" font-size="11" fill="#ffee00" text-anchor="middle">VS BOT</text>
    <!-- Puntaje Bot -->
    <text x="270" y="29" font-family="'Press Start 2P', monospace" font-size="20" fill="#ff0055" text-anchor="middle" filter="url(#neon-pink)">4</text>
  </g>

  <!-- Banner de Trampa Alerta (Superior Canvas) -->
  <g transform="translate(180, 68)">
    <rect x="0" y="0" width="440" height="34" rx="5" fill="rgba(255, 0, 85, 0.2)" stroke="#ff0055" stroke-width="2" />
    <text x="220" y="22" font-family="'Press Start 2P', monospace" font-size="10" fill="#ffee00" text-anchor="middle" letter-spacing="1">
      ⚠️ ¡EL BOT ESTÁ HACIENDO TRAMPA! ⚠️
    </text>
  </g>

  <!-- Banner Inferior Informativo Retro -->
  <g transform="translate(60, 405)">
    <rect x="0" y="0" width="680" height="58" rx="8" fill="#080814" stroke="#ff0055" stroke-width="2" opacity="0.95" />
    <text x="340" y="24" font-family="'Press Start 2P', monospace, sans-serif" font-size="13" fill="#ff0055" text-anchor="middle" filter="url(#neon-pink)">
      PONG: IMPOSSIBLE
    </text>
    <text x="340" y="44" font-family="'Outfit', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#cbd5e1" text-anchor="middle">
      "EL BOT HARÁ TRAMPA" &bull; 30 TRAMPAS COLECCIONABLES &bull; WEB AUDIO API &bull; CRT NEÓN
    </text>
  </g>

  <!-- Overlay Scanlines CRT -->
  <rect x="0" y="0" width="800" height="480" fill="url(#pong-scanlines)" pointer-events="none" />
</svg>

